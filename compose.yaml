# Local development services (TS-06): Postgres 18 and Mailpit, which captures outgoing email.
# Start them with `docker compose up -d`. Every port binds to localhost only.
# To remap a port on your machine, put the change in compose.override.yaml, which git ignores.
name: tonaris

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: tonaris
      POSTGRES_PASSWORD: tonaris
      POSTGRES_DB: tonaris
    ports:
      # Host port 5433, so it doesn't clash with a natively installed Postgres on 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      # Postgres 18 images keep their data in /var/lib/postgresql/18/docker; mount the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tonaris -d tonaris"]
      interval: 2s
      timeout: 5s
      retries: 15

  mailpit:
    image: axllent/mailpit:v1.31.6
    environment:
      # Accept any SMTP credentials over plain SMTP, so a sender configured with a login still works.
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # inbox web UI and API

volumes:
  postgres-data:
