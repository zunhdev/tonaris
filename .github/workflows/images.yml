# Docker images (TS-110, TS-124): builds tonaris-api and tonaris-web and runs them against Postgres and Mailpit the
# way a host would: migrate, seed the creator, start both, check their health and a sign-in email. Docker runs only
# here and in production, never locally (TS-06).
# To save runner minutes this runs only when the images' recipe or dependencies change, or by hand, and it isn't a
# required check. Static checks builds the same bundles on every pull request, and they are rehearsed natively
# before each push.

name: Images

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/images.yml
      - .dockerignore
      - apps/*/Dockerfile
      - apps/api/build.ts
      - apps/web/server.ts
      - apps/web/vite.config.ts
      - package.json
      - bun.lock
      - bunfig.toml
      - apps/*/package.json
      - packages/*/package.json
      - tooling/package.json
  push:
    branches: [main]
    paths:
      - .github/workflows/images.yml
      - .dockerignore
      - apps/*/Dockerfile
      - apps/api/build.ts
      - apps/web/server.ts
      - apps/web/vite.config.ts
      - package.json
      - bun.lock
      - bunfig.toml
      - apps/*/package.json
      - packages/*/package.json
      - tooling/package.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  images:
    name: Docker images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: tonaris
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.31.6
        ports: ["1025:1025", "8025:8025"]
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build tonaris-api
        run: docker build -f apps/api/Dockerfile -t tonaris-api .
      - name: Build tonaris-web
        run: docker build -f apps/web/Dockerfile -t tonaris-web .
      - name: Production settings for the smoke test
        run: |
          cat > "$RUNNER_TEMP/api.env" <<EOF
          DATABASE_URL=postgres://postgres@localhost:5432/tonaris
          API_ORIGIN=https://api.tonaris.example
          WEB_ORIGIN=https://tonaris.example
          BETTER_AUTH_SECRET=$(openssl rand -hex 32)
          SMTP_URL=smtp://localhost:1025
          EMAIL_FROM=Tonaris <no-reply@tonaris.example>
          SUPPORT_EMAIL=help@tonaris.example
          EOF
      - name: Pre-deploy steps (migrate, then seed the creator twice)
        run: |
          docker run --rm --network host --env-file "$RUNNER_TEMP/api.env" tonaris-api bun bin/migrate.js
          for run in 1 2; do
            docker run --rm --network host --env-file "$RUNNER_TEMP/api.env" \
              -e CREATOR_EMAIL=creator@tonaris.example tonaris-api bun bin/seed-creator.js
          done
      - name: Start the API, then the web app
        run: |
          docker run -d --name api --network host --env-file "$RUNNER_TEMP/api.env" tonaris-api
          docker run -d --name web --network host -e API_URL=https://api.tonaris.example tonaris-web
      - name: Both report healthy
        run: |
          for container in api web; do
            for attempt in $(seq 1 30); do
              status=$(docker inspect --format '{{.State.Health.Status}}' "$container")
              [ "$status" = healthy ] && break
              sleep 2
            done
            echo "$container: $status"
            [ "$status" = healthy ]
          done
      - name: Smoke test
        run: |
          curl -fsS http://localhost:3001/v1/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/v1/me)" = 401
          curl -fsS -H "origin: https://tonaris.example" -H "content-type: application/json" \
            -d '{"email":"creator@tonaris.example","type":"sign-in"}' \
            http://localhost:3001/auth/email-otp/send-verification-otp
          for attempt in $(seq 1 20); do
            count=$(curl -s "http://localhost:8025/api/v1/search?query=to%3A%22creator%40tonaris.example%22" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["messages_count"])')
            [ "$count" = 1 ] && break
            sleep 1
          done
          echo "sign-in emails: $count"
          [ "$count" = 1 ]
          page=$(curl -fsS -D "$RUNNER_TEMP/web-headers" http://localhost:3000/sign-in)
          grep -q '<meta name="tonaris:api-url" content="https://api.tonaris.example"' <<< "$page"
          grep -qi "content-security-policy: .*connect-src 'self' https://api.tonaris.example" "$RUNNER_TEMP/web-headers"
      - name: Container logs
        if: always()
        run: |
          docker logs api || true
          docker logs web || true
