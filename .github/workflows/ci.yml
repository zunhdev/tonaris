# CI (TS-124): every pull request to main and every push to main. The "Protect main" ruleset requires Static
# checks. The Tests job is commented out for now to save runner minutes (see the note above it); `bun run check`
# runs every check locally. Actions are pinned to commit SHAs and images to exact versions (TS-07).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install
        run: bun install --frozen-lockfile
      - name: Format (oxfmt)
        run: bun run format:check
      - name: Lint (oxlint, type-aware)
        run: bun run lint
      - name: Typecheck (tsc per package)
        run: bun run typecheck
      - name: Workspace rules
        run: bun run check:workspace
      - name: OpenSpec (validate --all --strict)
        run: bun run check:specs
      - name: Migrations match the schema
        run: bun run db:check
      - name: OpenAPI document is up to date
        run: bun run openapi:check
      - name: OpenAPI has no breaking change (oasdiff)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          OASDIFF_VERSION: 1.33.0
          OASDIFF_SHA256: 43a4e328e2d13ba1552d760aa68d2485c75c5621f309f6ff64ae895188345247
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          if ! git show FETCH_HEAD:apps/api/openapi/v1.json > "$RUNNER_TEMP/base.json" 2>/dev/null; then
            echo "No OpenAPI document on $BASE_REF yet; nothing to compare."
            exit 0
          fi
          archive="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/${archive}"
          echo "$OASDIFF_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" oasdiff
          # A new member of a response's oneOf, such as a new entity on the change stream, and a new value of a
          # response enum, such as a TS-27 outcome reason, are additive: clients must tolerate them (TS-09), so
          # they are reported as warnings rather than failing the check.
          "$RUNNER_TEMP/oasdiff" breaking "$RUNNER_TEMP/base.json" apps/api/openapi/v1.json --fail-on ERR \
            --severity-levels apps/api/openapi/oasdiff-levels.txt
      - name: Build both apps (the production bundles the images copy)
        run: bun run build

  # ── Tests: temporarily disabled to stay within a budget (decided by the creator, 18 October 2026) ──────────────
