[install]
# `bun add` writes exact versions, never ranges (tech spec TS-07).
exact = true
# Each package resolves only the dependencies it declares, so an import that
# breaks the layering in TS-02 fails instead of silently working via hoisting.
linker = "isolated"

[test]
# The finished M1 spikes' tests check copies of logic production now owns
# (docs/spikes/), so `bun test` leaves them out. To run one spike's, override:
# bun test --path-ignore-patterns='' tooling/src/spikes/g1-tidal
pathIgnorePatterns = ["tooling/src/spikes/**"]
